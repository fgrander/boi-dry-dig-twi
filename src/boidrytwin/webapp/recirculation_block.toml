# Exhaust recirculation with mixing chamber pressure control (feature 004), appended by
# "Add recirculation" in the web app. Example values sized for plant_reference.toml, not
# plant data: adapt the damper, fan and resistances to the plant.

[recirculation]
pressure_sensor_time_constant = "2 s"
duct_heat_loss = "0 W/K"
max_share = "70 %"
dew_point_margin = "10 K"

[recirculation.damper]
open_mass_flow = "18 kg/s"
design_pressure_drop = "500 Pa"
design_temperature = "290 degC"

[recirculation.exhaust_fan]
nominal_speed = "990 rpm"
speed = "990 rpm"
curve_temperature = "290 degC"
curve = [["15 m^3/s", "3105 Pa"], ["25 m^3/s", "2700 Pa"], ["35 m^3/s", "1890 Pa"]]

[recirculation.resistances.drum_path]
mass_flow = "15 kg/s"
pressure_drop = "1200 Pa"
temperature = "290 degC"

[recirculation.resistances.stack]
mass_flow = "9.3 kg/s"
pressure_drop = "300 Pa"
temperature = "290 degC"

[recirculation.controller]
mode = "automatic"
setpoint = "-200 Pa"
# SIMC from a damper step test on the twin (scripts/tune_controllers.py pressure)
gain = "0.000122 1/Pa"
integral_time = "1.8 s"
output_min = "0 %"
output_max = "100 %"
not_reached_band = "50 Pa"
not_reached_hold = "10 min"
