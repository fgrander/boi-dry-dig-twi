# Oil demand step: return temperature drops from 240 to 231.6 degC at 06:00, i.e. +20 %
# oil heat demand at 60 kg/s (42 K -> 50.4 K rise to 282 degC). Quickstart §4, SC-004.
schema_version = 1
name = "Boiler house: +20 % oil heat demand at 06:00"

[time]
start = "2026-01-01T00:00:00Z"
end = "2026-01-02T00:00:00Z"
output_interval = "1 min"

[ambient]
temperature = "20 degC"
relative_humidity = "60 %"
pressure = "101.3 kPa"

[boiler_house.fuel]
kind = "wood_chips"
moisture_wet_basis = "45 %"
temperature = "10 degC"

[boiler_house.combustion_air]
temperature = "20 degC"
relative_humidity = "60 %"

[boiler_house.furnace]
rated_fuel_power = "15 MW"
min_load_fraction = "30 %"
bed_time_constant = "15 min"
water_time_constant = "10 min"
feed_dead_time = "2 min"

[[boiler_house.heaters]]
type = "radiant"

[[boiler_house.heaters]]
type = "convective"
n_rows = 8
tube_mass = "3.5 t"
oil_volume = "1.0 m^3"

[[boiler_house.heaters]]
type = "convective"
n_rows = 11
tube_mass = "4.8 t"
oil_volume = "1.38 m^3"

[boiler_house.bypass]
starts_after_heater = 1
position = "0 %"

[boiler_house.thermal_oil]
oil = "shell_s2"
mass_flow = "60 kg/s"
return_temperature = { file = "data/oil_return_step.csv", column = "return_temperature" }

[boiler_house.controllers.oil_temperature]
mode = "automatic"
setpoint = "282 degC"
# SIMC from step tests on the twin (scripts/tune_controllers.py)
gain = "0.191 kg/(s*K)"
integral_time = "1157 s"
output_min = "0.47 kg/s"
output_max = "2.2 kg/s"
not_reached_band = "2 K"
not_reached_hold = "10 min"

[boiler_house.controllers.oxygen]
mode = "automatic"
setpoint = "7 %"
gain = 32.1
integral_time = "30 s"
output_min = 1.1
output_max = 2.5
not_reached_band = "0.5 %"
not_reached_hold = "10 min"

[boiler_house.initial_state]
kind = "steady_state"
